name: Build & Release Production Extension

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-release:
    name: Package & Release (Chrome + Firefox)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Run Production Packager
        run: python scripts/package.py

      - name: Read Extension Version
        id: get_version
        run: |
          VERSION=$(python -c "import json; print(json.load(open('src/manifest.json'))['version'])")
          echo "VERSION=$VERSION" >> $GITHUB_ENV
          echo "Extracted version: $VERSION"

      - name: Upload Chrome Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: hotswap-for-claude-chrome-v${{ env.VERSION }}
          path: dist/chrome/
          retention-days: 90

      - name: Upload Firefox Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: hotswap-for-claude-firefox-v${{ env.VERSION }}
          path: dist/firefox/
          retention-days: 90

      - name: Create or Update GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ env.VERSION }}-b${{ github.run_number }}
          name: HotSwap for Claude v${{ env.VERSION }} (Build #${{ github.run_number }})
          body: |
            ## 🚀 Automated Production Build #${{ github.run_number }}

            ### 📦 Release Assets
            - **Google Chrome**: `hotswap-for-claude-chrome-v${{ env.VERSION }}.zip` (Manifest V3)
            - **Mozilla Firefox**: `hotswap-for-claude-firefox-v${{ env.VERSION }}.zip` (Gecko MV3)

            ---
            *Commit: `${{ github.sha }}`*
            *Triggered by commit: ${{ github.event.head_commit.message }}*
          draft: false
          prerelease: false
          files: |
            store-assets/v${{ env.VERSION }}/hotswap-for-claude-chrome-v${{ env.VERSION }}.zip
            store-assets/v${{ env.VERSION }}/hotswap-for-claude-firefox-v${{ env.VERSION }}.zip
            store-assets/v${{ env.VERSION }}/hotswap-for-claude-v${{ env.VERSION }}.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
