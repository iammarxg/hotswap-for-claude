name: Build & Release Production Extension

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-release:
    name: Package & Release (Chrome + Firefox)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Run Production Packager
        run: python package.py

      - name: Read Extension Version
        id: get_version
        run: |
          VERSION=$(python -c "import json; print(json.load(open('extension/manifest.json'))['version'])")
          echo "VERSION=$VERSION" >> $GITHUB_ENV
          echo "Extracted version: $VERSION"

      - name: Upload Chrome Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: hotswap-for-claude-chrome-v${{ env.VERSION }}
          path: dist/chrome/
          retention-days: 90

      - name: Upload Firefox Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: hotswap-for-claude-firefox-v${{ env.VERSION }}
          path: dist/firefox/
          retention-days: 90

      - name: Extract Release Notes
        id: extract_notes
        run: |
          python -c "
          import re
          content = open('CHANGELOG.md', 'r', encoding='utf-8').read()
          ver = '${{ env.VERSION }}'
          pattern = r'##\s*\[v?' + re.escape(ver) + r'\][^\n]*\n(.*?)(?=\n##\s*\[|\Z)'
          match = re.search(pattern, content, re.DOTALL)
          if match:
              notes = match.group(1).strip()
          else:
              notes = content
          with open('RELEASE_NOTES.md', 'w', encoding='utf-8') as f:
              f.write(notes)
          print('Extracted', len(notes), 'chars of release notes.')
          "

      - name: Create or Update GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ env.VERSION }}
          name: HotSwap for Claude v${{ env.VERSION }}
          body_path: RELEASE_NOTES.md
          draft: false
          prerelease: false
          make_latest: true
          files: |
            dist/hotswap-for-claude-chrome-v${{ env.VERSION }}.zip
            dist/hotswap-for-claude-firefox-v${{ env.VERSION }}.zip
            dist/hotswap-for-claude-v${{ env.VERSION }}.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
